<script>
    let MASTER_DATABASE = [];
    let SPORT_GEAR_TEMPLATES = {};
    let selectedRouteData = null;
    const sportKey = 'rock-climb';

    async function loadRockClimbingData() {
        try {
            const sportRes = await fetch('https://raw.githubusercontent.com/Gerber111213/Adventure-planner/main/sports.json');
            if (sportRes.ok) {
                const templates = await sportRes.json();
                if (templates[sportKey]) {
                    SPORT_GEAR_TEMPLATES = templates[sportKey];
                }
            }

            const routeRes = await fetch('https://raw.githubusercontent.com/Gerber111213/Adventure-planner/main/climbing-routes.json');
            if (routeRes.ok) {
                MASTER_DATABASE = await routeRes.json();
                console.log("Loaded Climbing Database:", MASTER_DATABASE); // Check your browser console (F12) to see exact keys
                setupRockClimbingUI();
            } else {
                console.warn("Could not load climbing-routes.json");
            }
        } catch (e) {
            console.warn("Error loading data:", e);
        }
    }

    function setupRockClimbingUI() {
        const regSelect = document.getElementById('cascade-region');
        regSelect.innerHTML = '<option value="">Select Region</option>';

        const uniqueRegions = [...new Set(MASTER_DATABASE.map(reg => reg.regionName || reg.region || reg.name))].filter(Boolean);

        uniqueRegions.forEach(regName => {
            regSelect.innerHTML += `<option value="${regName}">${regName}</option>`;
        });
    }

    function onRegionChange() {
        const regVal = document.getElementById('cascade-region').value;
        const cragSelect = document.getElementById('cascade-crag');
        const routeSelect = document.getElementById('cascade-route');

        cragSelect.innerHTML = '<option value="">Select Crag / Area</option>';
        routeSelect.innerHTML = '<option value="">Select Specific Route</option>';
        routeSelect.disabled = true;

        if (!regVal) {
            cragSelect.disabled = true;
            return;
        }

        cragSelect.disabled = false;
        
        const matchingRegions = MASTER_DATABASE.filter(r => (r.regionName || r.region || r.name) === regVal);
        
        let allCrags = [];
        matchingRegions.forEach(regionObj => {
            // Check all possible property names where crags/areas might live in your JSON
            const possibleCrags = regionObj.crags || regionObj.areas || regionObj.subregions || regionObj.locations || [];
            
            possibleCrags.forEach(crag => {
                const cragName = crag.cragName || crag.crag || crag.name || crag.title;
                if (cragName && !allCrags.includes(cragName)) {
                    allCrags.push(cragName);
                }
            });
        });

        allCrags.forEach(cragName => {
            cragSelect.innerHTML += `<option value="${cragName}">${cragName}</option>`;
        });
    }

    function onCragChange() {
        const regVal = document.getElementById('cascade-region').value;
        const cragVal = document.getElementById('cascade-crag').value;
        const routeSelect = document.getElementById('cascade-route');

        routeSelect.innerHTML = '<option value="">Select Specific Route</option>';

        if (regVal && cragVal) {
            routeSelect.disabled = false;
            const matchingRegions = MASTER_DATABASE.filter(r => (r.regionName || r.region || r.name) === regVal);
            
            let foundCragObj = null;
            matchingRegions.forEach(regionObj => {
                const possibleCrags = regionObj.crags || regionObj.areas || regionObj.subregions || regionObj.locations || [];
                const match = possibleCrags.find(c => (c.cragName || c.crag || c.name || c.title) === cragVal);
                if (match) foundCragObj = match;
            });

            const routesList = foundCragObj ? (foundCragObj.routes || foundCragObj.climbs || foundCragObj.objectives || []) : [];
            routesList.forEach(route => {
                const routeName = route.name || route.routeName || route.title;
                const routeGrade = route.grade || route.rating || '';
                routeSelect.innerHTML += `<option value="${routeName}">${routeName} (${routeGrade})</option>`;
            });
        } else {
            routeSelect.disabled = true;
        }
    }

    function onRouteSelect() {
        const routeName = document.getElementById('cascade-route').value;
        if (!routeName) return;

        const regVal = document.getElementById('cascade-region').value;
        const cragVal = document.getElementById('cascade-crag').value;
        const matchingRegions = MASTER_DATABASE.filter(r => (r.regionName || r.region || r.name) === regVal);
        
        let matchedRoute = null;
        matchingRegions.forEach(regionObj => {
            const possibleCrags = regionObj.crags || regionObj.areas || regionObj.subregions || regionObj.locations || [];
            const cragObj = possibleCrags.find(c => (c.cragName || c.crag || c.name || c.title) === cragVal);
            if (cragObj) {
                const routesList = cragObj.routes || cragObj.climbs || cragObj.objectives || [];
                const route = routesList.find(rt => (rt.name || rt.routeName || rt.title) === routeName);
                if (route) matchedRoute = route;
            }
        });

        if (matchedRoute) {
            selectedRouteData = matchedRoute;
            document.getElementById('route-search').value = matchedRoute.name || matchedRoute.routeName || matchedRoute.title;
            applyRouteData(matchedRoute);
        }
    }

    function applyRouteData(item) {
        let betaText = item.notes || item.description || 'No specific technical beta recorded.';
        
        if (item.pitchesBreakdown && Array.isArray(item.pitchesBreakdown)) {
            betaText += '<br><br><strong>🧗‍♂️ Pitch-by-Pitch Breakdown:</strong><ul style="margin: 4px 0 0 20px; padding: 0;">';
            item.pitchesBreakdown.forEach(p => {
                betaText += `<li><strong>Pitch ${p.pitch || ''} (${p.grade || ''}):</strong> ${p.description || ''}</li>`;
            });
            betaText += '</ul>';
        }

        document.getElementById('route-notes').value = item.notes || item.description || '';
        document.getElementById('stat-grade').textContent = item.grade || item.rating || 'Standard';
        document.getElementById('stat-pitches').textContent = item.length ? `${item.length} (${item.pitches || 1} Pitches)` : `${item.pitches || 1} Pitches`;
        document.getElementById('stat-approach').textContent = item.approach || 'No specific approach notes recorded.';
        document.getElementById('stat-beta').innerHTML = betaText;
        document.getElementById('route-beta-display').style.display = 'block';

        if (item.mapSearchQuery) {
            const mapsBtn = document.getElementById('maps-link-btn');
            mapsBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.mapSearchQuery)}`;
            mapsBtn.style.display = 'flex';
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadRockClimbingData();
    });

    function calculateDuration() {
        const start = new Date(document.getElementById('start-date').value);
        const end = new Date(document.getElementById('end-date').value);
        if (start && end && end >= start) {
            const diffDays = Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1;
            document.getElementById('duration-days').value = diffDays;
            document.getElementById('duration-nights').value = diffDays - 1;
        }
    }

    function updateNights() {
        const days = parseInt(document.getElementById('duration-days').value) || 1;
        document.getElementById('duration-nights').value = days > 1 ? days - 1 : 0;
    }

    function generateManifest() {
        const defaultSafety = ["Garmin inReach / Satellite Communicator", "First Aid Kit", "Headlamp with extra batteries"];
        const defaultClothing = ["Base Layer", "Insulating Mid-layer", "Wind/Shell Jacket", "Climbing Helmet"];
        const defaultFuel = ["Water Storage (2L minimum)", "High-Energy Nutrition / Snacks"];

        let hardwareList = ["Climbing Harness", "Locking Carabiners (x3-4)", "Belay/Rappel Device", "Personal Anchor System (PAS)"];

        let boltCount = 0;
        if (selectedRouteData) {
            const textToCheck = (selectedRouteData.notes || '') + ' ' + (selectedRouteData.approach || '');
            if (selectedRouteData.pitchesBreakdown && Array.isArray(selectedRouteData.pitchesBreakdown)) {
                selectedRouteData.pitchesBreakdown.forEach(p => {
                    const match = (p.description || '').match(/(\d+)\s*bolts?/i);
                    if (match) boltCount += parseInt(match[1]);
                });
            }
            const generalMatch = textToCheck.match(/(\d+)\s*bolts?/i);
            if (boltCount === 0 && generalMatch) {
                boltCount = parseInt(generalMatch[1]);
            }
        }

        if (boltCount > 0) {
            const totalDraws = boltCount + 2;
            hardwareList.unshift(`Quickdraws: ${totalDraws} total (${boltCount} for bolts + 2 extra for anchor/extensions)`);
        } else {
            hardwareList.unshift("Quickdraws: 12 total (10 standard + 2 extra for anchor/extensions)");
        }

        let ropeRecommendation = "Single Rope: 70m dynamic climbing rope (Standard)";
        if (selectedRouteData) {
            const lengthStr = (selectedRouteData.length || '').toLowerCase();
            const notesStr = (selectedRouteData.notes || '').toLowerCase();
            const totalPitches = selectedRouteData.pitches || 1;

            if (totalPitches > 1 || lengthStr.includes('multi') || lengthStr.includes('alpine') || notesStr.includes('alpine')) {
                ropeRecommendation = "Ropes: Dual 60m half/twin ropes (Recommended for multi-pitch rappels and rope drag reduction)";
            } else if (lengthStr.includes('80m') || lengthStr.includes('long pitch') || lengthStr.includes('40m')) {
                ropeRecommendation = "Single Rope: 80m dynamic climbing rope (Required for long pitch length)";
            } else if (lengthStr.includes('60m') || lengthStr.includes('short')) {
                ropeRecommendation = "Single Rope: 60m dynamic climbing rope";
            }
        }
        hardwareList.push(ropeRecommendation);

        const template = SPORT_GEAR_TEMPLATES.safety ? SPORT_GEAR_TEMPLATES : {
            safety: defaultSafety,
            clothing: defaultClothing,
            fuel: defaultFuel
        };

        renderManifestCategory('list-safety', template.safety || defaultSafety, 'safety');
        renderManifestCategory('list-hardware', hardwareList, 'hardware');
        renderManifestCategory('list-clothing', template.clothing || defaultClothing, 'clothing');
        renderManifestCategory('list-fuel', template.fuel || defaultFuel, 'fuel');
        
        document.getElementById('manifest-card').style.display = 'block';
        document.getElementById('manifest-card').scrollIntoView({ behavior: 'smooth' });
    }

    function renderManifestCategory(elementId, items, categoryKey) {
        const ul = document.getElementById(elementId);
        ul.innerHTML = '';
        items.forEach((item, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="gear-item-left">
                    <input type="checkbox" id="${categoryKey}-${index}">
                    <label for="${categoryKey}-${index}" style="font-weight: normal; margin-bottom: 0; cursor: pointer;">${item}</label>
                </div>
                <button type="button" class="delete-gear-btn" onclick="this.parentElement.remove()" title="Remove Item">✕</button>
            `;
            ul.appendChild(li);
        });
    }

    function importGpxFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('route-notes').value += `\n[GPX Imported: ${file.name}] Track metadata successfully parsed.`;
            alert(`Successfully imported GPX track: ${file.name}!`);
        };
        reader.readAsText(file);
    }

    function exportGpxFile() {
        let gpxData = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Adventure Planner Engine">\n`;
        gpxData += `  <wpt lat="51.4968" lon="-115.9281">\n    <name>${document.getElementById('route-search').value || 'Rock Route'}</name>\n    <cmt>${document.getElementById('route-notes').value}</cmt>\n  </wpt>\n`;
        gpxData += `</gpx>`;
        
        const blob = new Blob([gpxData], { type: 'application/gpx+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'rock-climbing-export.gpx';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

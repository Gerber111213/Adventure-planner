<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canyoning Sport Planner</title>
    <style>
        :root {
            --primary-color: #0b4f6c;
            --secondary-color: #01baef;
            --accent-color: #20bf55;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #ced4da;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        header p {
            margin: 0.5rem 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .form-group select,
        .form-group input {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            background-color: #fff;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn:hover {
            background-color: #07384f;
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            margin-top: 1rem;
        }

        .btn-secondary:hover {
            background-color: #0195be;
        }

        .map-preview {
            margin-top: 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            height: 250px;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-weight: 600;
        }

        .packing-list {
            margin-top: 1.5rem;
            border-top: 2px solid var(--bg-color);
            padding-top: 1.5rem;
        }

        .packing-list h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .checkbox-item input {
            margin-right: 0.75rem;
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Canyoning Adventure Planner</h1>
        <p>Plan your descent, check logistics, and gear up safely</p>
    </header>

    <div class="container">
        <div class="card">
            <form id="canyoning-form">
                <!-- Region Dropdown -->
                <div class="form-group">
                    <label for="region">Region</label>
                    <select id="region" required>
                        <option value="">-- Select Region --</option>
                    </select>
                </div>

                <!-- Canyon Dropdown -->
                <div class="form-group">
                    <label for="canyon">Canyon</label>
                    <select id="canyon" required disabled>
                        <option value="">-- Select Region First --</option>
                    </select>
                </div>

                <!-- Date and Days Row -->
                <div class="row">
                    <div class="form-group">
                        <label for="trip-date">Trip Date</label>
                        <input type="date" id="trip-date" required>
                    </div>
                    <div class="form-group">
                        <label for="trip-days">Number of Days</label>
                        <input type="number" id="trip-days" min="1" value="1" required>
                    </div>
                </div>

                <!-- GPS Map Integration Option -->
                <button type="button" id="load-map-btn" class="btn btn-secondary">View GPS Route via Google Maps</button>
                <div id="map-container" class="map-preview hidden">
                    Google Maps GPS View Loaded for Selected Canyon
                </div>

                <!-- Packing List Button -->
                <button type="button" id="packing-btn" class="btn" style="margin-top: 1.5rem;">Generate Suggested Packing List</button>
            </form>

            <!-- Packing List Output Area -->
            <div id="packing-section" class="packing-list hidden">
                <h3>Required Canyoning Gear Checklist</h3>
                <div id="checklist-items">
                    <!-- Dynamic Checklist items injected via JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let canyonData = [];

        // Fetch the canyoning JSON dataset
        async function loadCanyonData() {
            try {
                const response = await fetch('canyoning.json');
                if (!response.ok) throw new Error('Could not load canyon data');
                canyonData = await response.json();
                populateRegions();
            } catch (error) {
                console.error('Error fetching JSON, using fallback mock data:', error);
                // Fallback structure mirroring a typical canyoning database format
                canyonData = [
                    { region: "Alps (France)", name: "Riolan Canyon", gps: "43.882, 6.954" },
                    { region: "Alps (France)", name: "Maglia Canyon", gps: "43.904, 7.422" },
                    { region: "Sierra de Guara (Spain)", name: "Mascun Canyon", gps: "42.278, -0.124" },
                    { region: "Sierra de Guara (Spain)", name: "Formiga Canyon", gps: "42.245, -0.211" }
                ];
                populateRegions();
            }
        }

        const regionSelect = document.getElementById('region');
        const canyonSelect = document.getElementById('canyon');
        const mapBtn = document.getElementById('load-map-btn');
        const mapContainer = document.getElementById('map-container');
        const packingBtn = document.getElementById('packing-btn');
        const packingSection = document.getElementById('packing-section');
        const checklistItems = document.getElementById('checklist-items');

        function populateRegions() {
            const regions = [...new Set(canyonData.map(item => item.region))].sort();
            regionSelect.innerHTML = '<option value="">-- Select Region --</option>';
            regions.forEach(region => {
                const opt = document.createElement('option');
                opt.value = region;
                opt.textContent = region;
                regionSelect.appendChild(opt);
            });
        }

        regionSelect.addEventListener('change', (e) => {
            const selectedRegion = e.target.value;
            canyonSelect.innerHTML = '<option value="">-- Select Canyon --</option>';
            
            if (!selectedRegion) {
                canyonSelect.disabled = true;
                return;
            }

            const filteredCanyons = canyonData.filter(item => item.region === selectedRegion);
            filteredCanyons.forEach(canyon => {
                const opt = document.createElement('option');
                opt.value = canyon.name;
                opt.textContent = canyon.name;
                canyonSelect.appendChild(opt);
            });
            canyonSelect.disabled = false;
        });

        mapBtn.addEventListener('click', () => {
            const selectedCanyonName = canyonSelect.value;
            if (!selectedCanyonName) {
                alert('Please select a region and canyon first.');
                return;
            }
            const canyonObj = canyonData.find(c => c.name === selectedCanyonName);
            mapContainer.classList.remove('hidden');
            mapContainer.textContent = `GPS Route Active: ${canyonObj ? canyonObj.name + ' (' + canyonObj.gps + ')' : selectedCanyonName}`;
        });

        packingBtn.addEventListener('click', () => {
            const region = regionSelect.value;
            const canyon = canyonSelect.value;
            const date = document.getElementById('trip-date').value;

            if (!region || !canyon || !date) {
                alert('Please fill out the Region, Canyon, and Trip Date before generating a packing list.');
                return;
            }

            const gearList = [
                "Canyoning Wetsuit (Neoprene 5mm jacket & pants)",
                "Canyoning Harness with protective seat cover",
                "Canyoning Helmet (CE certified)",
                "Canyoning Boots with high-friction rubber soles",
                "Neoprene Socks",
                "Dynamic Canyoning Ropes (water-resistant)",
                "Double Cowstails / Lanyards with locking carabiners",
                "Descender (e.g., Pirana or stock figure 8 modified)",
                "Waterproof Container / Dry Bag",
                "First Aid Kit & Emergency Blanket",
                "Whistle",
                "Energy Snacks and Hydration"
            ];

            checklistItems.innerHTML = '';
            gearList.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'checkbox-item';
                div.innerHTML = `
                    <input type="checkbox" id="gear-${index}">
                    <label for="gear-${index}" style="margin-bottom:0; font-weight:normal; cursor:pointer;">${item}</label>
                `;
                checklistItems.appendChild(div);
            });

            packingSection.classList.remove('hidden');
            packingSection.scrollIntoView({ behavior: 'smooth' });
        });

        loadCanyonData();
    </script>
</body>
</html>

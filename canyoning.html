<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canyoning Adventure Planner</title>
    <style>
        :root {
            --primary-color: #2b4c7e;
            --secondary-color: #52796f;
            --accent-color: #354f52;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.4rem;
            font-weight: 700;
        }

        header p {
            margin: 0.5rem 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-container {
            max-width: 650px;
            margin: 2.5rem auto;
            padding: 0 1rem;
        }

        .planner-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
            border: 1px solid var(--border-color);
        }

        .form-section {
            margin-bottom: 1.5rem;
        }

        .form-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            font-size: 0.95rem;
        }

        .form-section select,
        .form-section input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #fff;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-section select:focus,
        .form-section input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(43, 76, 126, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        .action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
            margin-top: 0.5rem;
        }

        .action-btn:hover {
            background-color: #1f375c;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .map-btn {
            background-color: var(--secondary-color);
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .map-btn:hover {
            background-color: #3e5c53;
        }

        .map-display {
            background-color: #e2e8f0;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            color: #475569;
            font-weight: 600;
            margin-top: 1rem;
        }

        .packing-container {
            margin-top: 2rem;
            border-top: 2px solid #f1f5f9;
            padding-top: 1.5rem;
        }

        .packing-container h3 {
            color: var(--primary-color);
            margin-top: 0;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            background: #f8fafc;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .checklist-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary-color);
            margin-right: 0.8rem;
            cursor: pointer;
        }

        .checklist-item label {
            font-weight: normal;
            cursor: pointer;
            color: var(--text-color);
            margin-bottom: 0;
            user-select: none;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .planner-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Canyoning Adventure Planner</h1>
        <p>Coordinate your descent, map routes, and gear up precisely</p>
    </header>

    <div class="main-container">
        <div class="planner-card">
            <form id="canyoning-planner-form">
                
                <!-- Region Dropdown -->
                <div class="form-section">
                    <label for="region-select">Region</label>
                    <select id="region-select" required>
                        <option value="">-- Choose a Region --</option>
                    </select>
                </div>

                <!-- Canyon Dropdown -->
                <div class="form-section">
                    <label for="canyon-select">Canyon</label>
                    <select id="canyon-select" required disabled>
                        <option value="">-- Select Region First --</option>
                    </select>
                </div>

                <!-- Date and Duration Row -->
                <div class="form-row">
                    <div class="form-section">
                        <label for="trip-date">Trip Date</label>
                        <input type="date" id="trip-date" required>
                    </div>
                    <div class="form-section">
                        <label for="trip-days">Number of Days</label>
                        <input type="number" id="trip-days" min="1" value="1" required>
                    </div>
                </div>

                <!-- GPS Map Integration Option -->
                <button type="button" id="map-toggle-btn" class="action-btn map-btn">View GPS Route via Google Maps</button>
                <div id="map-box" class="map-display hidden">
                    Google Maps GPS View Loaded for Selected Canyon
                </div>

                <!-- Suggested Packing List Button -->
                <button type="button" id="packing-gen-btn" class="action-btn">Generate Suggested Packing List</button>
            </form>

            <!-- Dynamic Packing List Output -->
            <div id="packing-output-section" class="packing-container hidden">
                <h3>Required Canyoning Gear Checklist</h3>
                <div id="gear-checklist-container">
                    <!-- Checkboxes injected via JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let canyoningDatabase = [];

        // Load canyoning.json containing region and canyon datasets
        async function fetchCanyoningData() {
            try {
                const res = await fetch('canyoning.json');
                if (!res.ok) throw new Error('Network response failed');
                canyoningDatabase = await res.json();
                initializeRegions();
            } catch (err) {
                console.warn('Could not load canyoning.json directly, fallback data active:', err);
                // Fallback structured data matching standard rock-climb/canyoning format specs
                canyoningDatabase = [
                    { region: "Alps (France)", name: "Riolan Canyon", gps: "43.882, 6.954" },
                    { region: "Alps (France)", name: "Maglia Canyon", gps: "43.904, 7.422" },
                    { region: "Sierra de Guara (Spain)", name: "Mascun Canyon", gps: "42.278, -0.124" },
                    { region: "Sierra de Guara (Spain)", name: "Formiga Canyon", gps: "42.245, -0.211" },
                    { region: "Ticino (Switzerland)", name: "Boggera Canyon", gps: "46.265, 9.012" }
                ];
                initializeRegions();
            }
        }

        const regionDropdown = document.getElementById('region-select');
        const canyonDropdown = document.getElementById('canyon-select');
        const mapToggleButton = document.getElementById('map-toggle-btn');
        const mapBoxContainer = document.getElementById('map-box');
        const packingGenButton = document.getElementById('packing-gen-btn');
        const packingOutputSection = document.getElementById('packing-output-section');
        const gearChecklistContainer = document.getElementById('gear-checklist-container');

        function initializeRegions() {
            const uniqueRegions = [...new Set(canyoningDatabase.map(item => item.region))].sort();
            regionDropdown.innerHTML = '<option value="">-- Choose a Region --</option>';
            uniqueRegions.forEach(regionName => {
                const opt = document.createElement('option');
                opt.value = regionName;
                opt.textContent = regionName;
                regionDropdown.appendChild(opt);
            });
        }

        regionDropdown.addEventListener('change', (e) => {
            const selectedRegionValue = e.target.value;
            canyonDropdown.innerHTML = '<option value="">-- Choose a Canyon --</option>';
            
            if (!selectedRegionValue) {
                canyonDropdown.disabled = true;
                return;
            }

            const matchingCanyons = canyoningDatabase.filter(item => item.region === selectedRegionValue);
            matchingCanyons.forEach(canyonItem => {
                const opt = document.createElement('option');
                opt.value = canyonItem.name;
                opt.textContent = canyonItem.name;
                canyonDropdown.appendChild(opt);
            });
            canyonDropdown.disabled = false;
        });

        mapToggleButton.addEventListener('click', () => {
            const chosenCanyon = canyonDropdown.value;
            if (!chosenCanyon) {
                alert('Please select a specific region and canyon first to load GPS.');
                return;
            }
            const foundRecord = canyoningDatabase.find(c => c.name === chosenCanyon);
            mapBoxContainer.classList.remove('hidden');
            mapBoxContainer.textContent = `GPS Route Active: ${foundRecord ? foundRecord.name + ' [Coordinates: ' + foundRecord.gps + ']' : chosenCanyon}`;
        });

        packingGenButton.addEventListener('click', () => {
            const regVal = regionDropdown.value;
            const canVal = canyonDropdown.value;
            const dateVal = document.getElementById('trip-date').value;

            if (!regVal || !canVal || !dateVal) {
                alert('Please fill out the Region, Canyon, and Trip Date fields prior to building your packing list.');
                return;
            }

            const essentialGear = [
                "Canyoning Wetsuit (5mm Neoprene Jacket & Long Johns)",
                "Canyoning Harness with integrated protective seat rump",
                "UIAA/CE Certified Canyoning Helmet",
                "High-Friction Rubber Soled Canyoning Boots",
                "Neoprene Thermal Socks",
                "Dynamic Canyoning Main & Backup Ropes",
                "Dual Cowstails / Lanyards with Screw-lock Carabiners",
                "Specialized Canyoning Descender (e.g., Pirana)",
                "Waterproof Barrel / Dry Bag Container",
                "First Aid Kit & Thermal Emergency Blanket",
                "Emergency Pealess Whistle",
                "High-Energy Nutrition & Electrolyte Hydration"
            ];

            gearChecklistContainer.innerHTML = '';
            essentialGear.forEach((gearItem, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'checklist-item';
                wrapper.innerHTML = `
                    <input type="checkbox" id="gear-chk-${idx}">
                    <label for="gear-chk-${idx}">${gearItem}</label>
                `;
                gearChecklistContainer.appendChild(wrapper);
            });

            packingOutputSection.classList.remove('hidden');
            packingOutputSection.scrollIntoView({ behavior: 'smooth' });
        });

        // Initialize script logic on load
        fetchCanyoningData();
    </script>
</body>
</html>

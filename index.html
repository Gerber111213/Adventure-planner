<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Multi-Sport Adventure & Life-Safety Engine</title>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --accent: #238636;
            --accent-hover: #2ea043;
            --text: #c9d1d9;
            --text-bright: #ffffff;
            --link-blue: #58a6ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
            line-height: 1.5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1, h3 {
            color: var(--text-bright);
            margin-top: 0;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .hero-banner {
            text-align: center;
            padding: 45px 20px;
            background: linear-gradient(135deg, #1f242d 0%, #161b22 100%);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 24px;
        }
        .hero-banner h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--text-bright);
        }
        .hero-banner p {
            color: #8b949e;
            font-size: 16px;
            margin: 0;
        }
        .activity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .activity-btn {
            background: #21262d;
            border: 1px solid var(--border);
            color: var(--text-bright);
            padding: 20px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
        }
        .activity-btn:hover {
            background: #30363d;
            border-color: var(--link-blue);
            transform: translateY(-2px);
        }
        .activity-btn span.icon {
            font-size: 28px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LANDING PAGE HERO -->
        <div class="hero-banner">
            <h1>"Out of the office, into the wild."</h1>
            <p>Select your sport discipline to launch an isolated life-safety planner and route repository.</p>
        </div>

        <!-- DYNAMIC SPORT SELECTION GRID -->
        <div class="card">
            <h3 style="margin-bottom: 16px;">Choose Your Sport Discipline</h3>
            <div id="activity-grid" class="activity-grid">
                <!-- Dynamically populated from sports.json -->
            </div>
        </div>
    </div>

    <script>
        async function loadLandingPage() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/Gerber111213/Adventure-planner/main/sports.json');
                if (response.ok) {
                    const sportsData = await response.json();
                    renderLandingGrid(sportsData);
                } else {
                    console.warn("Could not fetch sports.json");
                }
            } catch (e) {
                console.warn("Error loading sports registry:", e);
            }
        }

        function renderLandingGrid(sportsMap) {
            const grid = document.getElementById('activity-grid');
            grid.innerHTML = '';

            Object.keys(sportsMap).forEach(key => {
                const sport = sportsMap[key];
                
                // Creates an anchor card linking to its dedicated sport page (e.g. canyoning.html, climbing.html)
                const btn = document.createElement('a');
                btn.className = 'activity-btn';
                btn.href = `${key}.html`;
                
                btn.innerHTML = `
                    <span class="icon">${sport.icon || '🏔️'}</span>
                    <span>${sport.name}</span>
                `;
                grid.appendChild(btn);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadLandingPage();
        });
    </script>
</body>
</html>
